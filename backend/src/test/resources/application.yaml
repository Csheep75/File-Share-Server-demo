spring:
  datasource:
    url: jdbc:h2:mem:fileshare;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

fileserver:
  base-url: http://127.0.0.1:9

app:
  jwt-secret: TestSecretKeyForJwtTokenGenerationMustBeLongEnough!!
  jwt-expire-hours: 72
