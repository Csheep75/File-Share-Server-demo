server:
  port: 8081

spring:
  application:
    name: fileshare
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fileshare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:fileshare}
    password: ${SPRING_DATASOURCE_PASSWORD:FileShare@2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

fileserver:
  base-url: ${DUFS_BASE_URL:http://localhost:5000}

app:
  jwt-secret: ${JWT_SECRET:HotSpotFileShare2026SecretKeyForJwtTokenGeneration!!}
  jwt-expire-hours: 72